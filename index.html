    <style>
        /* CSS Variables for theming */
        :root {
            --primary-bg: #ffffff;
            --secondary-bg: #f8f9fa;
            --header-bg: #1a1a1a;
            --text-color: #333333;
            --border-color: #dee2e6;
            --control-bg: #ffffff;
            --control-text: #333333;
            --accent-color: #007bff;
            --success-color: #28a745;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --primary-bg: #1a1a1a;
            --secondary-bg: #2d2d2d;
            --header-bg: #000000;
            --text-color: #ffffff;
            --border-color: #404040;
            --control-bg: #2d2d2d;
            --control-text: #ffffff;
            --shadow: rgba(255, 255, 255, 0.1);
        }

        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-color);
            line-height: 1.6;
            transition: all 0.3s ease;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 10px;
        }

        /* Header Styles */
        header {
            background: var(--header-bg);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px var(--shadow);
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 600;
        }

        .header-controls {
            display: flex;
            gap: 10px;
        }

        .theme-toggle, .refresh-button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover, .refresh-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        /* Controls Section */
        .controls-section {
            background: var(--secondary-bg);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 4px var(--shadow);
        }

        /* Search Container */
        .search-container {
            margin-bottom: 20px;
        }

        .search-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        #flightSearch {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: var(--control-bg);
            color: var(--control-text);
            font-size: 16px;
            transition: all 0.3s ease;
        }

        #flightSearch:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        #searchButton {
            padding: 12px 20px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            min-width: 60px;
        }

        #searchButton:hover {
            background: #0056b3;
            transform: translateY(-2px);
        }

        #searchButton:active {
            transform: translateY(0);
        }

        /* Search Results */
        .search-results {
            max-height: 300px;
            overflow-y: auto;
            border-radius: 8px;
            background: var(--control-bg);
            border: 1px solid var(--border-color);
            margin-top: 10px;
        }

        .search-results:empty {
            display: none;
        }

        .search-results-header {
            padding: 12px 16px;
            background: var(--secondary-bg);
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
        }

        .search-result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.2s ease;
        }

        .search-result-item:hover {
            background: var(--secondary-bg);
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .flight-number {
            font-weight: 600;
            color: var(--accent-color);
        }

        .pin-flight {
            padding: 6px 12px;
            background: var(--success-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .pin-flight:hover {
            background: #218838;
            transform: scale(1.05);
        }

        .pin-flight:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
        }

        .no-results, .loading, .error {
            padding: 20px;
            text-align: center;
            color: #6c757d;
        }

        /* Filters Container */
        .filters-container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .filter-select {
            padding: 10px 12px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            background: var(--control-bg);
            color: var(--control-text);
            font-size: 14px;
            min-width: 140px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        /* Mobile Toggle Buttons */
        .mobile-toggle-buttons {
            display: none;
            gap: 10px;
            margin-top: 15px;
        }

        .toggle-btn {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: var(--control-bg);
            color: var(--control-text);
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .toggle-btn.active {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .toggle-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px var(--shadow);
        }

        /* Status Section */
        .status-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: var(--secondary-bg);
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .connection-status {
            font-weight: 600;
        }

        /* Tables Container */
        .tables-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .table-section {
            background: var(--control-bg);
            border-radius: 10px;
            box-shadow: 0 4px 6px var(--shadow);
            overflow: hidden;
        }

        .table-section h2 {
            background: var(--header-bg);
            color: white;
            padding: 15px 20px;
            margin: 0;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .table-wrapper {
            overflow-x: auto;
            max-height: 600px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background: var(--secondary-bg);
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        tr:hover {
            background: var(--secondary-bg);
        }

        /* Pinned Flight Styles */
        .pinned-flight {
            background: #fff3cd !important;
            border-left: 4px solid var(--warning-color);
            position: relative;
        }

        [data-theme="dark"] .pinned-flight {
            background: #332b00 !important;
        }

        .pinned-badge {
            font-size: 12px;
            margin-left: 5px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .delete-pinned, .add-pinned {
            background: var(--danger-color);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 12px;
            margin: 2px;
            transition: all 0.3s ease;
        }

        .add-pinned {
            background: var(--success-color);
        }

        .delete-pinned:hover {
            background: #c82333;
            transform: scale(1.1);
        }

        .add-pinned:hover {
            background: #218838;
            transform: scale(1.1);
        }

        /* Status indicators */
        .status-on-time { color: var(--success-color); font-weight: 600; }
        .status-delayed { color: var(--danger-color); font-weight: 600; }
        .status-cancelled { color: #6c757d; font-weight: 600; }
        .status-completed { color: var(--success-color); font-weight: 600; }

        /* Loading states */
        .loading {
            padding: 40px 20px;
            text-align: center;
            color: #6c757d;
            background: var(--secondary-bg);
            border-radius: 8px;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #6c757d;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Pinned Counter */
        .pinned-counter {
            text-align: center;
            padding: 15px;
            background: var(--secondary-bg);
            border-radius: 8px;
            margin-top: 20px;
            font-weight: 600;
        }

        #pinnedCount {
            color: var(--accent-color);
            font-size: 1.2em;
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            max-width: 350px;
        }

        .toast {
            background: var(--header-bg);
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 10px;
            box-shadow: 0 4px 12px var(--shadow);
            transform: translateX(400px);
            transition: transform 0.3s ease;
            position: relative;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success {
            background: var(--success-color);
        }

        .toast.error {
            background: var(--danger-color);
        }

        .toast.warning {
            background: var(--warning-color);
            color: #000;
        }

        .toast.info {
            background: var(--accent-color);
        }

        /* Offline Indicator */
        .offline-indicator {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--warning-color);
            color: #000;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
            box-shadow: 0 4px 12px var(--shadow);
            z-index: 1000;
            display: none;
        }

        /* Swipe Gesture Indicators (Mobile) */
        .swipe-indicator {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 24px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .swipe-indicator.left {
            left: 10px;
            color: var(--success-color);
        }

        .swipe-indicator.right {
            right: 10px;
            color: var(--danger-color);
        }

        .row-swiping .swipe-indicator {
            opacity: 1;
        }

        /* Mobile Optimizations */
        @media (max-width: 768px) {
            .container {
                padding: 5px;
            }

            header {
                padding: 10px 15px;
                margin-bottom: 15px;
            }

            header h1 {
                font-size: 1.4rem;
            }

            .controls-section {
                padding: 15px;
                margin-bottom: 15px;
            }

            .search-input-group {
                flex-direction: column;
            }

            #searchButton {
                padding: 10px;
            }

            .filters-container {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .filter-select {
                min-width: auto;
                font-size: 16px;
            }

            .mobile-toggle-buttons {
                display: flex;
            }

            .tables-container {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .table-section {
                display: none;
            }

            .table-section.active {
                display: block;
            }

            .table-wrapper {
                max-height: 70vh;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 8px 10px;
            }

            .mobile-hide {
                display: none;
            }

            .status-section {
                flex-direction: column;
                gap: 5px;
                text-align: center;
                font-size: 12px;
            }

            .delete-pinned, .add-pinned {
                padding: 10px 12px;
                font-size: 14px;
            }

            .toast-container {
                top: 10px;
                right: 10px;
                left: 10px;
                max-width: none;
            }

            .toast {
                margin-bottom: 5px;
                font-size: 14px;
            }
        }

        /* Small mobile devices */
        @media (max-width: 480px) {
            header h1 {
                font-size: 1.2rem;
            }

            .header-controls {
                gap: 5px;
            }

            .theme-toggle, .refresh-button {
                padding: 6px 10px;
                font-size: 1rem;
            }

            .controls-section {
                padding: 10px;
            }

            .filters-container {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 11px;
            }

            th, td {
                padding: 6px 8px;
            }

            .pinned-counter {
                font-size: 14px;
                padding: 10px;
            }
        }

        /* Landscape mobile orientation */
        @media (max-width: 768px) and (orientation: landscape) {
            .table-wrapper {
                max-height: 50vh;
            }
            
            .controls-section {
                padding: 10px;
            }
            
            .search-input-group {
                flex-direction: row;
            }
        }

        /* Accessibility improvements */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Print styles */
        @media print {
            .header-controls, .controls-section, .mobile-toggle-buttons {
                display: none;
            }
            
            .tables-container {
                grid-template-columns: 1fr;
            }
            
            .table-section {
                display: block !important;
                box-shadow: none;
                border: 1px solid #000;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛫 Cochin Airport Flight Tracker</h1>
            <div class="header-controls">
                <button id="themeToggle" class="theme-toggle">🌙</button>
                <button id="refreshButton" class="refresh-button">🔄</button>
            </div>
        </header>

        <!-- Search and Filter Section -->
        <div class="controls-section">
            <div class="search-container">
                <div class="search-input-group">
                    <input type="text" id="flightSearch" placeholder="Search flight number (e.g., IX123)" />
                    <button id="searchButton">🔍</button>
                </div>
                <div id="searchResults" class="search-results"></div>
            </div>

            <div class="filters-container">
                <select id="dateFilter" class="filter-select">
                    <option value="all">All Dates</option>
                    <option value="today">Today</option>
                    <option value="tomorrow">Tomorrow</option>
                </select>
                
                <select id="airlineFilter" class="filter-select">
                    <option value="all">All Airlines</option>
                    <option value="IX">Air India Express</option>
                    <option value="IXAI">IX + AI</option>
                </select>
                
                <select id="sortOption" class="filter-select">
                    <option value="eta">Sort by ETA</option>
                    <option value="airline">Sort by Airline</option>
                    <option value="flight">Sort by Flight Number</option>
                </select>
            </div>

            <div class="mobile-toggle-buttons">
                <button id="showArrivals" class="toggle-btn active">✈️ Arrivals</button>
                <button id="showDepartures" class="toggle-btn">🛫 Departures</button>
            </div>
        </div>

        <!-- Status Section -->
        <div class="status-section">
            <div id="lastUpdated" class="last-updated">Last updated: Never</div>
            <div id="connectionStatus" class="connection-status">🔴 Offline</div>
        </div>

        <!-- Flight Tables Section -->
        <div class="tables-container">
            <!-- Arrivals Table -->
            <div id="arrivalsSection" class="table-section active">
                <h2>📥 Arrivals</h2>
                <div class="table-wrapper">
                    <table id="arrivals-table">
                        <thead>
                            <tr>
                                <th>Flight</th>
                                <th>Airline</th>
                                <th class="mobile-hide">From</th>
                                <th>ETA</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
                <div id="arrivalsLoading" class="loading">Loading arrivals...</div>
            </div>

            <!-- Departures Table -->
            <div id="departuresSection" class="table-section">
                <h2>📤 Departures</h2>
                <div class="table-wrapper">
                    <table id="departures-table">
                        <thead>
                            <tr>
                                <th>Flight</th>
                                <th>Airline</th>
                                <th class="mobile-hide">To</th>
                                <th>ETD</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
                <div id="departuresLoading" class="loading">Loading departures...</div>
            </div>
        </div>

        <!-- Pinned Flights Counter -->
        <div id="pinnedCounter" class="pinned-counter">
            📌 Pinned Flights: <span id="pinnedCount">0</span>
        </div>
    </div>

    <!-- Mobile Toast Notifications -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Offline indicator -->
    <div id="offlineIndicator" class="offline-indicator">
        📶 You're offline. Data may be outdated.
    </div>

    <script>
        class FlightTracker {
            constructor() {
                this.pinnedFlights = this.loadFromCache();
                this.currentTab = 'arrivals';
                this.lastUpdate = null;
                this.refreshInterval = null;
                this.touchStartX = 0;
                this.touchStartY = 0;
                this.swipeThreshold = 100;
                this.lastFlightData = null;
                
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.setupMobileOptimizations();
                this.setupTheme();
                this.setupOfflineDetection();
                this.loadFlightData();
                this.startAutoRefresh();
                this.renderPinnedFlights();
                this.updatePinnedCounter();
            }

            setupEventListeners() {
                // Theme toggle
                document.getElementById('themeToggle').addEventListener('click', () => {
                    this.toggleTheme();
                });

                // Refresh button
                document.getElementById('refreshButton').addEventListener('click', () => {
                    this.loadFlightData();
                    this.showToast('Refreshing flight data...', 'info');
                });

                // Search functionality
                const searchInput = document.getElementById('flightSearch');
                const searchButton = document.getElementById('searchButton');
                
                searchButton.addEventListener('click', () => this.performSearch());
                searchInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.performSearch();
                });

                // Clear search when input is empty
                searchInput.addEventListener('input', (e) => {
                    if (e.target.value.trim() === '') {
                        document.getElementById('searchResults').innerHTML = '';
                    }
                });

                // Filter changes
                document.getElementById('dateFilter').addEventListener('change', () => {
                    this.applyFilters();
                });
                
                document.getElementById('airlineFilter').addEventListener('change', () => {
                    this.applyFilters();
                });
                
                document.getElementById('sortOption').addEventListener('change', () => {
                    this.applyFilters();
                });

                // Mobile toggle buttons
                document.getElementById('showArrivals').addEventListener('click', () => {
                    this.switchTab('arrivals');
                });
                
                document.getElementById('showDepartures').addEventListener('click', () => {
                    this.switchTab('departures');
                });

                // Pinned flight management
                document.addEventListener('click', (e) => {
                    if (e.target.classList.contains('delete-pinned')) {
                        const flightNumber = e.target.dataset.flight;
                        this.removePinnedFlight(flightNumber);
                    } else if (e.target.classList.contains('add-pinned')) {
                        const flightNumber = e.target.dataset.flight;
                        const type = e.target.dataset.type;
                        this.addPinnedFlightByNumber(flightNumber, type);
                    }
                });

                // Touch events for swipe gestures
                document.addEventListener('touchstart', (e) => this.handleTouchStart(e), { passive: true });
                document.addEventListener('touchmove', (e) => this.handleTouchMove(e), { passive: true });
                document.addEventListener('touchend', (e) => this.handleTouchEnd(e), { passive: true });
            }

            setupMobileOptimizations() {
                // Detect mobile device
                const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                
                if (isMobile) {
                    document.body.classList.add('mobile-device');
                    this.switchTab('arrivals');
                }

                // Handle orientation changes
                window.addEventListener('orientationchange', () => {
                    setTimeout(() => {
                        this.adjustTableHeight();
                    }, 100);
                });

                // Handle resize events
                window.addEventListener('resize', () => {
                    this.adjustTableHeight();
                });

                // Initial table height adjustment
                setTimeout(() => this.adjustTableHeight(), 1000);
            }

            setupTheme() {
                const savedTheme = localStorage.getItem('theme') || 'light';
                document.documentElement.setAttribute('data-theme', savedTheme);
                this.updateThemeToggle(savedTheme);
            }

            toggleTheme() {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                this.updateThemeToggle(newTheme);
                
                this.showToast(`Switched to ${newTheme} theme`, 'success');
            }

            updateThemeToggle(theme) {
                const toggle = document.getElementById('themeToggle');
                toggle.textContent = theme === 'dark' ? '☀️' : '🌙';
            }

            setupOfflineDetection() {
                const updateConnectionStatus = () => {
                    const statusElement = document.getElementById('connectionStatus');
                    const offlineIndicator = document.getElementById('offlineIndicator');
                    
                    if (navigator.onLine) {
                        statusElement.textContent = '🟢 Online';
                        statusElement.className = 'connection-status online';
                        offlineIndicator.style.display = 'none';
                    } else {
                        statusElement.textContent = '🔴 Offline';
                        statusElement.className = 'connection-status offline';
                        offlineIndicator.style.display = 'block';
                    }
                };

                window.addEventListener('online', updateConnectionStatus);
                window.addEventListener('offline', updateConnectionStatus);
                updateConnectionStatus();
            }

            switchTab(tab) {
                this.currentTab = tab;
                
                // Update button states
                document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
                document.getElementById(tab === 'arrivals' ? 'showArrivals' : 'showDepartures').classList.add('active');
                
                // Show/hide appropriate sections
                document.querySelectorAll('.table-section').forEach(section => section.classList.remove('active'));
                document.getElementById(tab + 'Section').classList.add('active');
            }

            adjustTableHeight() {
                const tables = document.querySelectorAll('.table-wrapper');
                const windowHeight = window.innerHeight;
                const headerHeight = document.querySelector('header').offsetHeight;
                const controlsHeight = document.querySelector('.controls-section').offsetHeight;
                const statusHeight = document.querySelector('.status-section').offsetHeight;
                
                const availableHeight = windowHeight - headerHeight - controlsHeight - statusHeight - 100;
                
                tables.forEach(table => {
                    table.style.maxHeight = `${Math.max(300, availableHeight)}px`;
                });
            }

            handleTouchStart(e) {
                if (e.touches.length !== 1) return;
                
                const touch = e.touches[0];
                this.touchStartX = touch.clientX;
                this.touchStartY = touch.clientY;
                
                const row = e.target.closest('tr');
                if (row && !row.querySelector('th')) {
                    row.classList.add('row-swiping');
                }
            }

            handleTouchMove(e) {
                if (e.touches.length !== 1) return;
                
                const touch = e.touches[0];
                const deltaX = touch.clientX - this.touchStartX;
                const deltaY = touch.clientY - this.touchStartY;
                
                if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 20) {
                    const row = e.target.closest('tr');
                    if (row && !row.querySelector('th')) {
                        const indicator = deltaX > 0 ? 'left' : 'right';
                        row.classList.add('row-swiping');
                        this.showSwipeIndicator(row, indicator);
                    }
                }
            }

            handleTouchEnd(e) {
                const deltaX = e.changedTouches[0].clientX - this.touchStartX;
                const deltaY = e.changedTouches[0].clientY - this.touchStartY;
                
                document.querySelectorAll('.row-swiping').forEach(row => {
                    row.classList.remove('row-swiping');
                    this.hideSwipeIndicators(row);
                });
                
                if (Math.abs(deltaX) > this.swipeThreshold && Math.abs(deltaX) > Math.abs(deltaY)) {
                    const row = e.target.closest('tr');
                    if (row && !row.querySelector('th')) {
                        const flightNumber = row.cells[0]?.textContent?.trim()?.replace('📌', '').trim();
                        
                        if (deltaX > 0) {
                            this.handleSwipePin(flightNumber, row);
                        } else {
                            this.handleSwipeUnpin(flightNumber);
                        }
                    }
                }
            }

            showSwipeIndicator(row, direction) {
                let indicator = row.querySelector('.swipe-indicator');
                if (!indicator) {
                    indicator = document.createElement('div');
                    indicator.className = `swipe-indicator ${direction}`;
                    row.style.position = 'relative';
                    row.appendChild(indicator);
                }
                
                indicator.textContent = direction === 'left' ? '📌' : '🗑️';
                indicator.classList.add(direction);
            }

            hideSwipeIndicators(row) {
                const indicators = row.querySelectorAll('.swipe-indicator');
                indicators.forEach(indicator => indicator.remove());
            }

            handleSwipePin(flightNumber, row) {
                if (!flightNumber) return;
                
                const type = row.closest('#arrivalsSection') ? 'arrivals' : 'departures';
                this.addPinnedFlightByNumber(flightNumber, type);
                this.showToast(`📌 Pinned ${flightNumber}`, 'success');
            }

            handleSwipeUnpin(flightNumber) {
                if (!flightNumber) return;
                
                this.removePinnedFlight(flightNumber);
                this.showToast(`🗑️ Unpinned ${flightNumber}`, 'info');
            }

            async loadFlightData() {
                try {
                    this.showLoading(true);
                    const cochiApiUrl = "https://api.allorigins.win/raw?url=https://data-live.flightradar24.com/zones/fcgi/feed.js?bounds=10.5,9.5,76.5,75.5&faa=1&satellite=1&mlat=1&flarm=1&adsb=1&gnd=1&air=1&vehicles=1&estimated=1&maxage=14400&gliders=1&stats=1";
                    
                    const response = await fetch(cochiApiUrl);
                    if (!response.ok) throw new Error('Network response was not ok');
                    
                    const data = await response.json();
                    this.lastFlightData = data;
                    this.processFlightData(data);
                    this.updateLastUpdated();
                    
                } catch (error) {
                    console.error('Error fetching flight data:', error);
                    this.showToast('Failed to load flight data. Please check your connection.', 'error');
                } finally {
                    this.showLoading(false);
                }
            }

            processFlightData(data) {
                const flights = Object.values(data.states || {}).map(flight => ({ flight }));
                
                const arrivals = flights.filter(f => this.isArrival(f));
                const departures = flights.filter(f => this.isDeparture(f));
                
                this.renderFlights(arrivals, 'arrivals');
                this.renderFlights(departures, 'departures');
                this.renderPinnedFlights();
            }

            isArrival(flight) {
                const destination = flight.flight?.airport?.destination?.code?.iata;
                return destination === 'COK';
            }

            isDeparture(flight) {
                const origin = flight.flight?.airport?.origin?.code?.iata;
                return origin === 'COK';
            }

            renderFlights(flights, type) {
                const tableBody = document.querySelector(`#${type}-table tbody`);
                if (!tableBody) return;
                
                const nonPinnedRows = tableBody.querySelectorAll('tr:not(.pinned-flight)');
                nonPinnedRows.forEach(row => row.remove());
                
                const filteredFlights = this.filterAndSortFlights(flights, type);
                
                filteredFlights.forEach(flight => {
                    const row = this.createFlightRow(flight, type, false);
                    tableBody.appendChild(row);
                });

                // Show message if no flights
                if (filteredFlights.length === 0) {
                    const row = document.createElement('tr');
                    row.innerHTML = `<td colspan="6" style="text-align: center; padding: 20px; color: #666;">No flights found</td>`;
                    tableBody.appendChild(row);
                }
            }

            filterAndSortFlights(flights, type) {
                const dateFilter = document.getElementById('dateFilter').value;
                const airlineFilter = document.getElementById('airlineFilter').value;
                const sortOption = document.getElementById('sortOption').value;
                
                const now = new Date();
                const todayStart = new Date(now);
                todayStart.setHours(0, 0, 0, 0);
                const todayEnd = new Date(now);
                todayEnd.setHours(23, 59, 59, 999);
                const tomorrowStart = new Date(todayEnd.getTime() + 1);
                const tomorrowEnd = new Date(tomorrowStart);
                tomorrowEnd.setHours(23, 59, 59, 999);

                return flights.filter(flight => {
                    const flightNumber = flight.flight?.identification?.number?.default || "";
                    const airlineCode = flightNumber.substring(0, 2);
                    
                    // Date filtering
                    const flightTime = this.getFlightTime(flight, type);
                    const flightDate = new Date(flightTime * 1000);
                    
                    if (dateFilter === 'today') {
                        if (flightDate < todayStart || flightDate > todayEnd) return false;
                    } else if (dateFilter === 'tomorrow') {
                        if (flightDate < tomorrowStart || flightDate > tomorrowEnd) return false;
                    }
                    
                    // Airline filtering
                    if (airlineFilter === 'IX') {
                        return airlineCode === 'IX' || flightNumber.startsWith('IX');
                    } else if (airlineFilter === 'IXAI') {
                        return ['IX', 'AI'].includes(airlineCode) || flightNumber.startsWith('IX') || flightNumber.startsWith('AI');
                    }
                    
                    return true;
                }).sort((a, b) => {
                    const aTime = this.getFlightTime(a, type);
                    const bTime = this.getFlightTime(b, type);
                    
                    if (sortOption === 'eta') {
                        return aTime - bTime;
                    } else if (sortOption === 'airline') {
                        const aAirline = a.flight?.airline?.name || '';
                        const bAirline = b.flight?.airline?.name || '';
                        return aAirline.localeCompare(bAirline);
                    } else if (sortOption === 'flight') {
                        const aFlight = a.flight?.identification?.number?.default || '';
                        const bFlight = b.flight?.identification?.number?.default || '';
                        return aFlight.localeCompare(bFlight);
                    }
                    
                    return 0;
                });
            }

            getFlightTime(flight, type) {
                if (type === 'departures') {
                    return flight.flight?.time?.estimated?.departure || 
                           flight.flight?.time?.scheduled?.departure || 
                           flight.flight?.time?.actual?.departure || 0;
                } else {
                    return flight.flight?.time?.estimated?.arrival || 
                           flight.flight?.time?.scheduled?.arrival || 
                           flight.flight?.time?.actual?.arrival || 0;
                }
            }

            createFlightRow(flight, type, isPinned = false) {
                const row = document.createElement('tr');
                row.className = isPinned ? 'pinned-flight' : '';
                
                const flightNumber = flight.flight?.identification?.number?.default || 'N/A';
                const airline = flight.flight?.airline?.name || 'Unknown';
                const location = type === 'arrivals' ? 
                    (flight.flight?.airport?.origin?.name || 'Unknown') : 
                    (flight.flight?.airport?.destination?.name || 'Unknown');
                
                const flightTime = this.getFlightTime(flight, type);
                const timeFormatted = flightTime ? new Date(flightTime * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'N/A';
                
                const status = this.getFlightStatus(flight, type);
                const statusClass = this.getStatusClass(status);
                
                row.innerHTML = `
                    <td>
                        ${flightNumber}
                        ${isPinned ? '<span class="pinned-badge">📌</span>' : ''}
                    </td>
                    <td>${airline}</td>
                    <td class="mobile-hide">${location}</td>
                    <td>${timeFormatted}</td>
                    <td class="${statusClass}">${status}</td>
                    <td>
                        ${isPinned ? 
                            `<button class="delete-pinned" data-flight="${flightNumber}">🗑️</button>` :
                            `<button class="add-pinned" data-flight="${flightNumber}" data-type="${type}">📌</button>`
                        }
                    </td>
                `;
                
                return row;
            }

            getFlightStatus(flight, type) {
                const estimated = type === 'departures' ? 
                    flight.flight?.time?.estimated?.departure : 
                    flight.flight?.time?.estimated?.arrival;
                const scheduled = type === 'departures' ? 
                    flight.flight?.time?.scheduled?.departure : 
                    flight.flight?.time?.scheduled?.arrival;
                const actual = type === 'departures' ? 
                    flight.flight?.time?.actual?.departure : 
                    flight.flight?.time?.actual?.arrival;
                
                if (actual) return 'Completed';
                if (estimated && scheduled) {
                    const delay = (estimated - scheduled) / 60;
                    if (delay > 15) return `Delayed ${Math.round(delay)}m`;
                    if (delay < -15) return 'Early';
                }
                
                return 'On Time';
            }

            getStatusClass(status) {
                if (status.includes('Delayed')) return 'status-delayed';
                if (status === 'Completed') return 'status-completed';
                if (status === 'Cancelled') return 'status-cancelled';
                return 'status-on-time';
            }

            async performSearch() {
                const query = document.getElementById('flightSearch').value.trim().toUpperCase();
                const resultsContainer = document.getElementById('searchResults');
                
                if (!query) {
                    resultsContainer.innerHTML = '';
                    return;
                }
                
                resultsContainer.innerHTML = '<div class="loading">Searching...</div>';
                
                try {
                    const results = await this.searchFlights(query);
                    this.displaySearchResults(results, query);
                } catch (error) {
                    resultsContainer.innerHTML = '<div class="error">Search failed</div>';
                    console.error('Search error:', error);
                }
            }

            async searchFlights(query) {
                const results = [];
                
                const tables = ['arrivals-table', 'departures-table'];
                
                tables.forEach(tableId => {
                    const rows = document.querySelectorAll(`#${tableId} tbody tr`);
                    rows.forEach(row => {
                        const flightCell = row.cells[0];
                        if (flightCell) {
                            const flightNumber = flightCell.textContent.replace('📌', '').trim();
                            if (flightNumber.includes(query)) {
                                const type = tableId.includes('arrivals') ? 'arrivals' : 'departures';
                                results.push({
                                    flightNumber,
                                    type,
                                    airline: row.cells[1]?.textContent || 'Unknown',
                                    location: row.cells[2]?.textContent || 'Unknown',
                                    time: row.cells[3]?.textContent || 'Unknown',
                                    source: 'current'
                                });
                            }
                        }
                    });
                });
                
                return results;
            }

            displaySearchResults(results, query) {
                const resultsContainer = document.getElementById('searchResults');
                
                if (results.length === 0) {
                    resultsContainer.innerHTML = `<div class="no-results">No flights found for "${query}"</div>`;
                    return;
                }
                
                let html = `<div class="search-results-header">Found ${results.length} flight(s):</div>`;
                
                results.forEach(result => {
                    const isPinned = this.pinnedFlights.some(pf => pf.flightNumber === result.flightNumber);
                    html += `
                        <div class="search-result-item">
                            <div>
                                <span class="flight-number">${result.flightNumber}</span>
                                <div style="font-size: 12px; color: #666;">
                                    ${result.airline} • ${result.location} • ${result.time}
                                </div>
                            </div>
                            <button class="pin-flight" data-flight="${result.flightNumber}" data-type="${result.type}" ${isPinned ? 'disabled' : ''}>
                                ${isPinned ? '📌 Pinned' : '➕ Pin'}
                            </button>
                        </div>
                    `;
                });
                
                resultsContainer.innerHTML = html;
                
                resultsContainer.querySelectorAll('.pin-flight').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const flightNumber = e.target.dataset.flight;
                        const type = e.target.dataset.type;
                        this.addPinnedFlightByNumber(flightNumber, type);
                        e.target.disabled = true;
                        e.target.textContent = '📌 Pinned';
                        this.showToast(`Pinned ${flightNumber}`, 'success');
                    });
                });
            }

            addPinnedFlightByNumber(flightNumber, type) {
                const tableBody = document.querySelector(`#${type}-table tbody`);
                const rows = tableBody.querySelectorAll('tr:not(.pinned-flight)');
                
                for (let row of rows) {
                    const rowFlightNumber = row.cells[0]?.textContent?.replace('📌', '').trim();
                    if (rowFlightNumber === flightNumber) {
                        const pinnedFlight = {
                            flightNumber,
                            type,
                            airline: row.cells[1]?.textContent || 'Unknown',
                            location: row.cells[2]?.textContent || 'Unknown',
                            time: row.cells[3]?.textContent || 'Unknown',
                            status: row.cells[4]?.textContent || 'Unknown',
                            pinnedAt: Date.now()
                        };
                        
                        this.pinnedFlights.push(pinnedFlight);
                        this.saveToCache();
                        this.renderPinnedFlights();
                        this.updatePinnedCounter();
                        break;
                    }
                }
            }

            removePinnedFlight(flightNumber) {
                this.pinnedFlights = this.pinnedFlights.filter(pf => pf.flightNumber !== flightNumber);
                this.saveToCache();
                this.renderPinnedFlights();
                this.updatePinnedCounter();
                this.showToast(`Removed ${flightNumber} from pinned flights`, 'info');
            }

            renderPinnedFlights() {
                document.querySelectorAll('.pinned-flight').forEach(row => row.remove());
                
                const pinnedByType = {
                    arrivals: this.pinnedFlights.filter(pf => pf.type === 'arrivals'),
                    departures: this.pinnedFlights.filter(pf => pf.type === 'departures')
                };
                
                Object.keys(pinnedByType).forEach(type => {
                    const tableBody = document.querySelector(`#${type}-table tbody`);
                    if (!tableBody) return;
                    
                    pinnedByType[type].forEach(pinnedFlight => {
                        const row = this.createPinnedFlightRow(pinnedFlight);
                        tableBody.insertBefore(row, tableBody.firstChild);
                    });
                });
            }

            createPinnedFlightRow(pinnedFlight) {
                const row = document.createElement('tr');
                row.className = 'pinned-flight';
                
                row.innerHTML = `
                    <td>
                        ${pinnedFlight.flightNumber}
                        <span class="pinned-badge">📌</span>
                    </td>
                    <td>${pinnedFlight.airline}</td>
                    <td class="mobile-hide">${pinnedFlight.location}</td>
                    <td>${pinnedFlight.time}</td>
                    <td class="${this.getStatusClass(pinnedFlight.status)}">${pinnedFlight.status}</td>
                    <td>
                        <button class="delete-pinned" data-flight="${pinnedFlight.flightNumber}">🗑️</button>
                    </td>
                `;
                
                return row;
            }

            updatePinnedCounter() {
                const counter = document.getElementById('pinnedCount');
                if (counter) {
                    counter.textContent = this.pinnedFlights.length;
                }
            }

            loadFromCache() {
                try {
                    const cached = localStorage.getItem('pinnedFlights');
                    return cached ? JSON.parse(cached) : [];
                } catch (error) {
                    console.error('Error loading pinned flights:', error);
                    return [];
                }
            }

            saveToCache() {
                try {
                    localStorage.setItem('pinnedFlights', JSON.stringify(this.pinnedFlights));
                } catch (error) {
                    console.error('Error saving pinned flights:', error);
                }
            }

            applyFilters() {
                if (this.lastFlightData) {
                    this.processFlightData(this.lastFlightData);
                }
            }

            startAutoRefresh() {
                this.refreshInterval = setInterval(() => {
                    if (navigator.onLine) {
                        this.loadFlightData();
                    }
                }, 5 * 60 * 1000);
            }

            showLoading(show) {
                const loadingElements = document.querySelectorAll('.loading');
                loadingElements.forEach(el => {
                    el.style.display = show ? 'block' : 'none';
                });
            }

            updateLastUpdated() {
                this.lastUpdate = new Date();
                const element = document.getElementById('lastUpdated');
                if (element) {
                    element.textContent = `Last updated: ${this.lastUpdate.toLocaleTimeString()}`;
                }
            }

            showToast(message, type = 'info', duration = 3000) {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.textContent = message;
                
                container.appendChild(toast);
                
                setTimeout(() => toast.classList.add('show'), 100);
                
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => {
                        if (container.contains(toast)) {
                            container.removeChild(toast);
                        }
                    }, 300);
                }, duration);
            }
        }

        // Initialize the application when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new FlightTracker();
        });

        // Register service worker for PWA functionality
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    const CACHE_NAME = 'flight-tracker-v1';
                    const urlsToCache = ['/'];
                    
                    self.addEventListener('install', event => {
                        event.waitUntil(
                            caches.open(CACHE_NAME)
                                .then(cache => cache.addAll(urlsToCache))
                        );
                    });
                    
                    self.addEventListener('fetch', event => {
                        event.respondWith(
                            caches.match(event.request)
                                .then(response => {
                                    return response || fetch(event.request);
                                })
                        );
                    });
                `;
                
                const blob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(blob);
                
                navigator.serviceWorker.register(swUrl)
                    .then(registration => {
                        console.log('SW registered: ', registration);
                    })
                    .catch(registrationError => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }
    </script>
</body>
</html>
